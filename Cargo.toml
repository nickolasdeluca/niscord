[workspace]
resolver = "3"
members = ["crates/protocol", "crates/server", "crates/media", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
niscord-media = { path = "crates/media" }
niscord-protocol = { path = "crates/protocol" }

anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Pixel loops are unbearably slow unoptimized, even while debugging the rest.
[profile.dev.package.niscord-media]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
