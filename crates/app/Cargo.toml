[package]
name = "niscord"
description = "Niscord: screen sharing with friends"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
niscord-media.workspace = true
niscord-protocol.workspace = true
niscord-transport.workspace = true

anyhow.workspace = true
bytes = "1"
dirs = "7"
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
slint = "1.18"
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
# Self-update: GitHub release checks and downloads (same rustls/ring stack as the WebSocket).
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
niscord-server = { path = "../server" }

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"
