[package]
name = "niscord-media"
description = "Screen capture and media pipeline for Niscord"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
openh264 = "0.9"
# Same version openh264 uses; only for option constants it doesn't re-export.
openh264-sys2 = "0.9"
thiserror = "2"
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-capture = "2"
# Same version windows-capture uses, so only one copy gets built.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
] }
